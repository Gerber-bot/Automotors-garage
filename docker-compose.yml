version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: automotors-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automotors_garage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Bound strictly to localhost for developer security (not publicly exposed)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/src/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-automotors_garage}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - automotors-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: automotors-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-automotors_garage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-replace-in-production-min-32-chars}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - automotors-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: automotors-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - automotors-network

volumes:
  postgres_data:
    driver: local

networks:
  automotors-network:
    driver: bridge
