name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build, Typecheck & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Static Typecheck Verification (0 errors enforced)
        run: npm run typecheck

      - name: Code Quality & Lint Verification (0 errors enforced)
        run: npm run lint

      - name: Security foundation and current workshop authorization
        run: npm run test:security

      - name: Run Complete Test Suite
        env:
          NODE_ENV: test
        run: npm test

      - name: Verify demo seed guards and idempotency (in-memory PGlite only)
        run: npm run test:seed

      - name: Next.js Production Build Verification
        run: npm run build

  windows-processes:
    name: Windows process identity and graceful lifecycle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate Windows scripts on disposable targets
        shell: powershell
        run: npm run test:windows
