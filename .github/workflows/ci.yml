name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build, Typecheck & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Static Typecheck Verification (0 errors enforced)
        run: npm run typecheck

      - name: Code Quality & Lint Verification (0 errors enforced)
        run: npm run lint

      - name: Run Complete Test Suite (includes security and workshop authorization)
        env:
          NODE_ENV: test
        run: npm test

      - name: Next.js Production Build Verification
        run: npm run build
